# The continuous integration of the site, as .claude/skills/coding/testing.md
# gives it: every push and pull request is checked and tested in the three
# engines, and a push to main that passed both is published on GitHub Pages.
# It needs no Rust: the reader of the individuals file, a CSV, a TSV or an
# xlsx, is table_io's package, which npm ci installs from its GitHub Release
# as it installs popnei's.
#
# The actions are pinned to their major version, the latest released on
# 24 September 2026. npm ci installs popnei from its public GitHub Release,
# by the URL and hash of the lockfile, so no token is needed.

name: site

on:
  push:
  pull_request:

permissions:
  contents: read

# One run at a time for each branch, in the order of the pushes, and none
# cancelled halfway. On the deploy job alone, an older run whose e2e
# finished later could publish over a newer one; here it waits for it, as
# in GitHub's starter workflow for Pages.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # Three jobs for each engine, each a third of its tests (--shard), all
  # run side by side. One job for each engine, on the two workers
  # Playwright gives the four processors of the runner, took 5.5 to 10
  # minutes on 27 September 2026, and 14.7 minutes for Chromium's 679
  # tests on 9 October 2026 (run 37897260261), when WebKit had run about
  # 500 of its 679 in 20 minutes and Firefox about 660, and the time limit
  # stopped both: WebKit's alone would have taken about 27 minutes. A third
  # of the tests, 212 to 234 of them, takes about 9 minutes in WebKit, and
  # each job spends 1.5 minutes more to install, build and upload, which
  # leaves room under the 20 minutes as the suite grows. Each job builds
  # the site with the pages of the tests and runs its share of its
  # engine's tests, as `npm run test:e2e` does for the three.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # An engine or a share that fails does not stop the others, whose
      # results are still wanted.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The browser of the installed Playwright for this engine, and the
      # system libraries it needs on Ubuntu.
      - run: npx playwright install --with-deps ${{ matrix.project }}
      # Firefox does not start without a window on the owner's Mac, so
      # this is where it runs (docs/plans/site.md, work package 2).
      - run: npm run build
        env:
          POPNEI_TEST_PAGES: "1"
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3
      # The report and the traces, to read what the browser did: kept
      # after every run, since a test that passed only on its retry fails
      # the run but leaves its trace from the first attempt, and a job
      # stopped by its time limit leaves the traces of the tests that
      # failed before it, which is all there is to read then.
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
